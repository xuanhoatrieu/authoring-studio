name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r plugins/authoring-studio/requirements.txt
      - run: python scripts/validate_repo.py
      - run: python scripts/build_standalone.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r plugins/authoring-studio/requirements.txt
      - name: Check tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/validate_repo.py --tag "$RELEASE_TAG"
          python scripts/build_release.py
      - name: Publish new release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --title "Authoring Studio $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
